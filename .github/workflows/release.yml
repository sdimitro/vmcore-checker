name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        description: "Tag/version to release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Release binaries embed the placeholder skip-list. Deployments
      # that bake in a real list (the initramfs pipeline) run
      # `make skiplist` and rebuild; released binaries still take
      # entries via --skiplist.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ inputs.version || github.ref_name }}" \
            -o vmcore-checker-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Build deb package
        if: matrix.goos == 'linux'
        run: |
          version="${{ inputs.version || github.ref_name }}"
          scripts/build-deb.sh vmcore-checker-linux-${{ matrix.goarch }} "${version#v}" ${{ matrix.goarch }}

      - name: Install TinyGo
        if: matrix.goos == 'linux'
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb
          sudo dpkg -i tinygo_0.41.1_amd64.deb

      # The tiny build must never diverge from the stock one; gate the
      # release on the same parity check CI runs.
      - name: TinyGo parity gate
        if: matrix.goos == 'linux'
        run: make verify-tiny

      - name: Build tiny binary
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          tinygo build -opt=z -no-debug \
            -ldflags "-X main.version=${{ inputs.version || github.ref_name }}" \
            -o vmcore-checker-tiny-linux-${{ matrix.goarch }} .

      - name: Build tiny deb package
        if: matrix.goos == 'linux'
        run: |
          version="${{ inputs.version || github.ref_name }}"
          scripts/build-deb.sh vmcore-checker-tiny-linux-${{ matrix.goarch }} "${version#v}" ${{ matrix.goarch }} . vmcore-checker-tiny

      - name: Generate checksums
        run: |
          for f in vmcore-checker-${{ matrix.goos }}-${{ matrix.goarch }} \
                   vmcore-checker-tiny-linux-${{ matrix.goarch }} \
                   vmcore-checker_*_${{ matrix.goarch }}.deb \
                   vmcore-checker-tiny_*_${{ matrix.goarch }}.deb; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmcore-checker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            vmcore-checker-${{ matrix.goos }}-${{ matrix.goarch }}
            vmcore-checker-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
            vmcore-checker-tiny-linux-${{ matrix.goarch }}
            vmcore-checker-tiny-linux-${{ matrix.goarch }}.sha256
            vmcore-checker_*.deb
            vmcore-checker_*.deb.sha256
            vmcore-checker-tiny_*.deb
            vmcore-checker-tiny_*.deb.sha256

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: |
            vmcore-checker-linux-amd64/vmcore-checker-linux-amd64
            vmcore-checker-linux-amd64/vmcore-checker-linux-amd64.sha256
            vmcore-checker-linux-amd64/vmcore-checker-tiny-linux-amd64
            vmcore-checker-linux-amd64/vmcore-checker-tiny-linux-amd64.sha256
            vmcore-checker-linux-amd64/vmcore-checker_*.deb
            vmcore-checker-linux-amd64/vmcore-checker_*.deb.sha256
            vmcore-checker-linux-amd64/vmcore-checker-tiny_*.deb
            vmcore-checker-linux-amd64/vmcore-checker-tiny_*.deb.sha256
            vmcore-checker-linux-arm64/vmcore-checker-linux-arm64
            vmcore-checker-linux-arm64/vmcore-checker-linux-arm64.sha256
            vmcore-checker-linux-arm64/vmcore-checker-tiny-linux-arm64
            vmcore-checker-linux-arm64/vmcore-checker-tiny-linux-arm64.sha256
            vmcore-checker-linux-arm64/vmcore-checker_*.deb
            vmcore-checker-linux-arm64/vmcore-checker_*.deb.sha256
            vmcore-checker-linux-arm64/vmcore-checker-tiny_*.deb
            vmcore-checker-linux-arm64/vmcore-checker-tiny_*.deb.sha256
            vmcore-checker-darwin-arm64/vmcore-checker-darwin-arm64
            vmcore-checker-darwin-arm64/vmcore-checker-darwin-arm64.sha256
          generate_release_notes: true
